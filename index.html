<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bani</title>
    <!-- 最初の描画の前に配色を決め、ダークのときに白く光らないようにする。
         キーと判定は src/app/theme.ts と同じ（読み込んだ後はあちらが引き継ぐ） -->
    <script>
      try {
        var pref = localStorage.getItem('bani.theme')
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- hashrock のサービス切り替え。要素はサイドバーと入口の見出しの右端に置く（src/components/BrandMark.tsx）。
         作業領域の上に浮かせると、どの画面でも右上の中身を隠してしまうため。
         別オリジンなので Service Worker はキャッシュせず、オフラインでは読めずに表示されないだけ -->
    <script type="module" src="https://repos.hashrock.info/switcher/v1.js"></script>
  </body>
</html>
